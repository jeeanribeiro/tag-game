# fly.io configuration — deploy with:  fly launch --copy-config  (or fly deploy)
# Socket.IO needs sticky sessions when scaling beyond one machine; a single
# machine (the default here) needs no extra configuration.

app = "tag-game"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
